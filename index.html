<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utkarsh Heritage Festival · Guwahati</title>
    <meta
      name="description"
      content="Five competitions in art, music, scripture and general knowledge for students of Class 1 to 10 in Guwahati. Free to explore, ₹99 to enter."
    />
    <meta name="theme-color" content="#0b1220" />

    <meta property="og:title" content="Utkarsh Heritage Festival · Guwahati" />
    <meta
      property="og:description"
      content="Five competitions for Class 1–10. Quiz online on 23 August; art, fancy dress, bhajan and shloka at ISKCON Guwahati on 30 August. Prizes and a certificate for everyone."
    />
    <meta property="og:type" content="website" />

    <!--
      Link previews. Most students arrive from a link pasted into a school
      WhatsApp group, so this image is doing real work — without it the link
      unfurls as a bare text card. Deliberately JPEG: several unfurlers still
      handle WebP unreliably. Absolute URL is required by the crawlers; update
      the host here if the site moves.
    -->
    <meta property="og:image" content="https://utkarsh-festival.vercel.app/art/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Krishna and the cowherd boys running through the forest with their cows."
    />
    <meta property="og:site_name" content="Utkarsh Heritage Festival" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Two families, roman only. Fraunces' italic axis and the separate
      Devanagari display face were dropped: together they roughly doubled the
      font payload to serve a handful of small labels, and this site is mostly
      read on cheap phones over mobile data. Italics are synthesised.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..900&family=Plus+Jakarta+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
